<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kmresolv — login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f8f8f7;
            --surface: #ffffff;
            --surface2: #f3f3f1;
            --border: #e8e8e5;
            --border2: #d8d8d4;
            --text: #1a1a18;
            --text2: #6b6b67;
            --text3: #b0b0aa;
            --accent: #2563eb;
            --accent-light: #eff4ff;
            --red: #dc2626;
            --red-light: #fef2f2;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
            --font: 'Geist', system-ui, sans-serif;
            --mono: 'Geist Mono', monospace;
        }

        [data-theme="dark"] {
            --bg: #111110;
            --surface: #1c1c1a;
            --surface2: #252523;
            --border: #2e2e2b;
            --border2: #3d3d39;
            --text: #eeeeed;
            --text2: #9a9a94;
            --text3: #5a5a56;
            --accent: #3b82f6;
            --accent-light: #172035;
            --red: #ef4444;
            --red-light: #280f0f;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 380px;
            padding: 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
        }

        .logo-mark {
            width: 26px;
            height: 26px;
            background: var(--accent);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-mark svg {
            width: 14px;
            height: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 14px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text2);
        }

        input {
            font-family: var(--font);
            font-size: 13px;
            padding: 8px 12px;
            border: 1px solid var(--border2);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            outline: none;
            transition: border-color 0.12s, box-shadow 0.12s;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #2563eb18;
        }

        input::placeholder {
            color: var(--text3);
        }

        .btn {
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: background 0.12s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            font-size: 12px;
            color: var(--red);
            background: var(--red-light);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            margin-top: 12px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            kmresolv
        </div>

        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="admin" autocomplete="username">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="btn" id="login-btn">Sign in</button>
        <div class="error" id="error-msg">Invalid username or password</div>
    </div>

    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme',
                saved ? saved : (prefersDark ? 'dark' : 'light'));
        })();

        const toHex = bytes =>
            Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');

        const SHA256_K = [
            0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
            0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
            0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
            0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
            0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
            0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
            0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
            0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ];

        function sha256(bytes) {
            const rotr = (x, n) => (x >>> n) | (x << (32 - n));
            const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
                       0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];

            const total = (((bytes.length + 8) >> 6) + 1) << 6;
            const buf = new Uint8Array(total);
            buf.set(bytes);
            buf[bytes.length] = 0x80;
            const dv = new DataView(buf.buffer);
            const bits = bytes.length * 8;
            dv.setUint32(total - 8, Math.floor(bits / 0x100000000));
            dv.setUint32(total - 4, bits >>> 0);

            const w = new Uint32Array(64);
            for (let off = 0; off < total; off += 64) {
                for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
                for (let i = 16; i < 64; i++) {
                    const x = w[i - 15], y = w[i - 2];
                    const s0 = rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3);
                    const s1 = rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10);
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
                }

                let [a, b, c, d, e, f, g, h] = H;
                for (let i = 0; i < 64; i++) {
                    const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                    const ch = (e & f) ^ (~e & g);
                    const t1 = (h + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
                    const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const t2 = (S0 + maj) >>> 0;
                    h = g; g = f; f = e; e = (d + t1) >>> 0;
                    d = c; c = b; b = a; a = (t1 + t2) >>> 0;
                }

                const v = [a, b, c, d, e, f, g, h];
                for (let i = 0; i < 8; i++) H[i] = (H[i] + v[i]) >>> 0;
            }

            const out = new Uint8Array(32);
            const outView = new DataView(out.buffer);
            for (let i = 0; i < 8; i++) outView.setUint32(i * 4, H[i]);
            return out;
        }

        function hmacSha256(keyBytes, msgBytes) {
            const key = keyBytes.length > 64 ? sha256(keyBytes) : keyBytes;
            const padded = new Uint8Array(64);
            padded.set(key);

            const inner = new Uint8Array(64 + msgBytes.length);
            const outer = new Uint8Array(64 + 32);
            for (let i = 0; i < 64; i++) {
                inner[i] = padded[i] ^ 0x36;
                outer[i] = padded[i] ^ 0x5c;
            }
            inner.set(msgBytes, 64);
            outer.set(sha256(inner), 64);
            return sha256(outer);
        }

        async function hmacHex(nonce, password) {
            const enc = new TextEncoder();

            if (window.crypto && crypto.subtle) {
                const key = await crypto.subtle.importKey(
                    'raw',
                    enc.encode(password),
                    { name: 'HMAC', hash: 'SHA-256' },
                    false,
                    ['sign']
                );
                const sig = await crypto.subtle.sign('HMAC', key, enc.encode(nonce));
                return toHex(new Uint8Array(sig));
            }

            return toHex(hmacSha256(enc.encode(password), enc.encode(nonce)));
        }

        async function login() {
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('error-msg');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) return;

            btn.disabled = true;
            btn.textContent = 'Signing in…';
            err.style.display = 'none';

            try {
                const { nonce } = await fetch('/api/login/challenge', {
                    method: 'POST'
                }).then(r => r.json());

                const response = await hmacHex(nonce, password);

                const data = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, nonce, response })
                }).then(r => r.json());

                if (data.ok) {
                    window.location.href = '/';
                } else {
                    err.textContent = data.error || 'Invalid username or password';
                    err.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign in';
                }
            } catch (e) {
                err.textContent = 'Could not reach server' + (e && e.message ? ' (' + e.message + ')' : '');
                err.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        }

        document.getElementById('login-btn').addEventListener('click', login);
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>

</html>
